name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Banking.sln

    - name: Build Solution
      run: dotnet build Banking.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test Banking.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
